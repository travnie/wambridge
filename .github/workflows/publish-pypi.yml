name: Publish WAMBridge to PyPI

on: # yamllint disable-line rule:truthy
  # Authenticated repository_dispatch is used by the GPTomek release operator.
  repository_dispatch:
    types: [publish_wambridge_pypi]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI (requires matching Trusted Publisher)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - run: uv python install 3.15
      - name: Verify requested PyPI version
        if: github.event_name == 'repository_dispatch'
        env:
          EXPECTED_VERSION: ${{ github.event.client_payload.version }}
        run: |
          uv run --no-project --python 3.15 -- python -c 'import os, pathlib, tomllib; v=tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]; expected=os.environ["EXPECTED_VERSION"]; assert expected and expected == v, f"Expected {expected}, project has {v}"'
      - name: Build wheel and sdist
        run: uv build --out-dir dist
      - name: Smoke test installed wheel
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --no-project --python 3.15 --with "./$wheel" -- python -c 'import wambridge, wambridge.radio_cli, wambridge.station_packs'
          uv run --no-project --python 3.15 --with "./$wheel" -- wambridge --help
      - name: Run repository tests
        run: uv run --no-project --python 3.15 --with . -- python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wambridge-python-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    if: ${{ github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'repository_dispatch' && github.event.action == 'publish_wambridge_pypi' && github.event.client_payload.publish == true)) }}
    needs: build
    runs-on: ubuntu-slim
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wambridge-python-distributions
          path: dist
      - run: uv publish --check-url https://pypi.org/simple/ dist/*
