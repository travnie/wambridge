name: Copilot setup

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"
  pull_request:
    paths:
      - ".github/workflows/copilot-setup-steps.yml"

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install media and archive tools
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v 7z >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg p7zip-full
          fi

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true

      - name: Install Python dependencies
        run: uv sync --locked

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK 37
        shell: bash
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          test -d "$ANDROID_HOME/platforms/android-37.0" || "$sdkmanager" "platforms;android-37.0"
          test -d "$ANDROID_HOME/build-tools/36.0.0" || "$sdkmanager" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare Android project
        run: ./mobile/gradlew -p mobile --no-daemon help

      - name: Download foobar2000 SDK
        run: |
          sdk_version="$(tr -d '\r\n' < foobar/sdk-version.txt)"
          [[ "$sdk_version" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          mkdir -p external/foobar-sdk
          curl -fsSL --retry 3 \
            https://www.foobar2000.org/downloads/SDK-${sdk_version}.7z \
            -o external/foobar-sdk.7z
          7z x external/foobar-sdk.7z -oexternal/foobar-sdk -y >/dev/null

          sdk_project="$(find external/foobar-sdk -type f -name foobar2000_SDK.vcxproj -print -quit)"
          test -n "$sdk_project"
          sdk_root="$(dirname "$(dirname "$(dirname "$sdk_project")")")"
          echo "FOOBAR_SDK_ROOT=$GITHUB_WORKSPACE/$sdk_root" >> "$GITHUB_ENV"
