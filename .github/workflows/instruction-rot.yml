      - GEMINI.md
      - CODEX.md
      - "**/AGENTS.md"
      - "**/CLAUDE.md"
      - "**/GEMINI.md"
      - "**/CODEX.md"
      - "**/copilot-instructions.md"
      - ".github/instructions/**"
      - "**/.cursor/rules/**"
