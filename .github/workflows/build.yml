name: Build

on:
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "foobar/**"
      - "pyproject.toml"
      - "uv.lock"
      - "src/**"
      - "tests/**"
      - "tools/**"
  # Main source builds run through release.yml; keep post-merge tests-only coverage.
  push:
    branches: [main]
    paths:
      - "tests/**"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: wambridge-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v9
        with:
          python-version: "3.14"
          enable-cache: true
          cache-python: true

      - name: Install dependencies
        shell: pwsh
        run: |
          uv sync --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check Python
        shell: pwsh
        run: |
          uv run ruff check src tests foobar/wambridge_pcm_entry.py tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run python -m compileall -q src tests foobar/wambridge_pcm_entry.py tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Python package
        shell: pwsh
        run: |
          uv run python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run wambridge-control --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run wambridge-events --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run wambridge-share --help | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build standalone helper
        shell: pwsh
        run: |
          uv run python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --name wambridge-pcm `
            --distpath dist/helper `
            --workpath build/pyinstaller `
            --specpath build/pyinstaller `
            foobar/wambridge_pcm_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/helper/wambridge-pcm/wambridge-pcm.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build standalone control helper
        shell: pwsh
        run: |
          uv run python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name wambridge-control `
            --distpath dist/control `
            --workpath build/pyinstaller-control `
            --specpath build/pyinstaller-control `
            tools/wambridge_control_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/control/wambridge-control.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build standalone share helper
        shell: pwsh
        run: |
          uv run python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name wambridge-share `
            --distpath dist/share `
            --workpath build/pyinstaller-share `
            --specpath build/pyinstaller-share `
            tools/wambridge_share_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/share/wambridge-share.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build standalone event listener
        shell: pwsh
        run: |
          uv run python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name wambridge-events `
            --distpath dist/events `
            --workpath build/pyinstaller-events `
            --specpath build/pyinstaller-events `
            tools/wambridge_events_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & dist/events/wambridge-events.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Download foobar2000 SDK
        shell: pwsh
        run: |
          $sdkVersion = (Get-Content foobar/sdk-version.txt -Raw).Trim()
          if ($sdkVersion -notmatch '^\d{4}-\d{2}-\d{2}$') {
            throw "Invalid foobar2000 SDK version"
          }
          $downloaded = $false
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            try {
              New-Item -ItemType Directory -Force external/foobar-sdk | Out-Null
              Invoke-WebRequest `
                -Uri "https://www.foobar2000.org/downloads/SDK-$sdkVersion.7z" `
                -OutFile external/foobar-sdk.7z `
                -TimeoutSec 35 `
                -OperationTimeoutSeconds 35
              7z x external/foobar-sdk.7z -oexternal/foobar-sdk -y
              if ($LASTEXITCODE -ne 0) { throw "Official SDK archive extraction failed" }
              $downloaded = $true
              break
            } catch {
              Write-Warning "Official SDK download attempt $attempt failed: $_"
              Remove-Item external/foobar-sdk.7z -ErrorAction SilentlyContinue
              Remove-Item external/foobar-sdk -Recurse -Force -ErrorAction SilentlyContinue
              if ($attempt -lt 2) { Start-Sleep -Seconds 3 }
            }
          }
          if (-not $downloaded) {
            # Unmodified SDK mirror, pinned to the SDK-2026-10-01 commit.
            if ($sdkVersion -ne "2026-10-01") {
              throw "No verified SDK mirror for version $sdkVersion"
            }
            $mirrorSha = "9e4823ee802dfb704de1ce42401b48b407a54180"
            New-Item -ItemType Directory -Force external/foobar-sdk | Out-Null
            Invoke-WebRequest `
              -Uri "https://codeload.github.com/reupen/foobar2000-sdk-unmodified/zip/$mirrorSha" `
              -OutFile external/foobar-sdk-mirror.zip `
              -TimeoutSec 60 `
              -OperationTimeoutSeconds 35
            Expand-Archive `
              -LiteralPath external/foobar-sdk-mirror.zip `
              -DestinationPath external/foobar-sdk -Force
            $readme = Get-ChildItem external/foobar-sdk -Recurse `
              -Filter sdk-readme.html | Select-Object -First 1
            if (-not $readme -or
                (Get-Content $readme.FullName -Raw) -notmatch "version $sdkVersion") {
              throw "Pinned SDK mirror does not match version $sdkVersion"
            }
            Write-Host "Using verified SDK mirror commit $mirrorSha"
          }

          $sdkProject = Get-ChildItem external/foobar-sdk `
            -Recurse -Filter foobar2000_SDK.vcxproj | Select-Object -First 1
          if (-not $sdkProject) {
            throw "foobar2000 SDK project not found after extraction"
          }
          $sdkRoot = Split-Path `
            (Split-Path (Split-Path $sdkProject.FullName -Parent) -Parent) -Parent
          "FOOBAR_SDK_ROOT=$sdkRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # A handled 7z failure must not become the pwsh step's exit code.
          $global:LASTEXITCODE = 0

      - name: Build x64 component
        shell: pwsh
        run: |
          # Keep the installed rolling build distinguishable when version stays 0.0.5.
          $sha = "$env:GITHUB_SHA"
          if ($sha -notmatch '^[0-9a-f]{40}$') { throw "Invalid build SHA" }
          @(
            '#pragma once'
            "#define WAMBRIDGE_BUILD_SHA `"$sha`""
          ) | Set-Content foobar/wam_build_sha.h -Encoding ascii

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest `
            -requires Microsoft.Component.MSBuild `
            -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild not found"
          }
          & $msbuild foobar/foo_out_wam.vcxproj `
            /t:Rebuild `
            /m `
            /p:Configuration=Release `
            /p:Platform=x64 `
            "/p:FoobarSdkRoot=$env:FOOBAR_SDK_ROOT"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Package component and source
        shell: pwsh
        run: |
          $output = "foobar/build/x64/Release/foo_out_wam.dll"
          if (-not (Test-Path $output)) {
            throw "foo_out_wam.dll was not produced"
          }
          New-Item -ItemType Directory -Force dist/component | Out-Null
          Copy-Item $output dist/component/foo_out_wam.dll
          Copy-Item `
            dist/helper/wambridge-pcm `
            dist/component/wambridge-pcm `
            -Recurse
          New-Item -ItemType Directory -Force dist/component/wambridge-control | Out-Null
          Copy-Item `
            dist/control/wambridge-control.exe `
            dist/component/wambridge-control/wambridge-control.exe
          New-Item -ItemType Directory -Force dist/component/wambridge-share | Out-Null
          Copy-Item `
            dist/share/wambridge-share.exe `
            dist/component/wambridge-share/wambridge-share.exe
          Push-Location dist/component
          7z a -tzip ../foo_out_wam.fb2k-component *
          $packed = $LASTEXITCODE
          Pop-Location
          if ($packed -ne 0) { exit $packed }
          Copy-Item $output dist/foo_out_wam.dll
          git archive `
            --format=zip `
            --output=dist/wambridge-source.zip `
            HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: foo_out_wam-x64
          path: |
            dist/control/wambridge-control.exe
            dist/events/wambridge-events.exe
            dist/share/wambridge-share.exe
            dist/foo_out_wam.dll
            dist/foo_out_wam.fb2k-component
            dist/wambridge-source.zip
          if-no-files-found: error
