name: Release

# Versioned releases only.
#
# Bumping the single project version in pyproject.toml on main cuts one fixed
# release. Pre-release suffixes such as -beta.1 become GitHub prereleases;
# a plain major.minor.patch version becomes a stable release.
#
# workflow_dispatch is retained for retrying a version whose release was not
# created yet. Existing tags/releases are never moved or replaced.
on:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      name: ${{ steps.parse.outputs.name }}
      code: ${{ steps.parse.outputs.code }}
      title: ${{ steps.parse.outputs.title }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Read release version
        id: parse
        shell: bash
        run: |
          set -euo pipefail

          name="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          test -n "$name"

          if [[ ! "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Version $name is not a supported semantic version" >&2
            exit 1
          fi

          code=$(( $(date -u +%s) / 60 ))

          echo "tag=v${name}" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "title=WAM Bridge ${name}" >> "$GITHUB_OUTPUT"

          if [[ "$name" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  component:
    uses: ./.github/workflows/build.yml

  apk:
    needs: version
    uses: ./.github/workflows/mobile.yml
    with:
      signed: true
      version-name: ${{ needs.version.outputs.name }}
      version-code: ${{ needs.version.outputs.code }}
    secrets: inherit

  publish:
    needs: [version, component, apk]
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: foo_out_wam-x64
          path: component

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: wambridge-apk
          path: apk

      - name: Publish fixed versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.name }}
          TITLE: ${{ needs.version.outputs.title }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          assets=(
            "component/foo_out_wam.fb2k-component"
            "component/wambridge-source.zip"
            "apk/wambridge-${VERSION}.apk"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; fixed releases are never replaced." >&2
            exit 1
          fi

          flags=(
            --target "$GITHUB_SHA"
            --title "$TITLE"
            --generate-notes
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          fi

          gh release create "$TAG" "${assets[@]}" "${flags[@]}"
