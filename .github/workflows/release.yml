name: Release

# Two shapes, one pipeline.
#
# The default channel is one normal rolling GitHub Release:
# one mutable tag, one permanent download link, assets replaced whenever main moves.
# Nobody has to invent a version number to ship a fix.
#
# workflow_dispatch with a version cuts a fixed, versioned release when a build is
# worth pinning.
on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/build.yml"
      - ".github/workflows/mobile.yml"
      - "foobar/**"
      - "mobile/**"
      - "src/**"
      - "tools/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Cut a fixed, versioned release instead of refreshing the rolling one,
          e.g. 0.2.0. Leave empty for the rolling release.
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-slim
    outputs:
      tag: ${{ steps.parse.outputs.tag }}
      name: ${{ steps.parse.outputs.name }}
      code: ${{ steps.parse.outputs.code }}
      title: ${{ steps.parse.outputs.title }}
      rolling: ${{ steps.parse.outputs.rolling }}
    steps:
      - name: Require main for releases
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be built from main, got $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Decide what is being published
        id: parse
        shell: bash
        env:
          REQUESTED: ${{ inputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The displayed version and the versionCode answer different
          # questions and are kept apart on purpose. The version says how mature
          # this is and lives in exactly one place, pyproject.toml, so nothing
          # can disagree with it again. The code only has to keep rising, which
          # whole hours since the epoch does on its own: monotonic, unique per
          # hour, comfortably inside Android's limit and already far above every
          # code shipped by hand before this.
          code=$(( $(date -u +%s) / 3600 ))
          base="$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)"
          test -n "$base"

          if [[ -n "${REQUESTED:-}" ]]; then
            name="${REQUESTED#v}"
            core="${name%%-*}"
            if [[ ! "$core" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Version $REQUESTED is not major.minor.patch" >&2
              exit 1
            fi
            if [[ "$name" != "$base" ]]; then
              echo "Fixed release $name must match pyproject.toml version $base" >&2
              exit 1
            fi
            echo "tag=v${name}" >> "$GITHUB_OUTPUT"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "title=WAMbridge ${name}" >> "$GITHUB_OUTPUT"
            echo "rolling=false" >> "$GITHUB_OUTPUT"
          else
            name="$base"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "title=WAM Bridge rolling" >> "$GITHUB_OUTPUT"
            echo "rolling=true" >> "$GITHUB_OUTPUT"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  component:
    needs: version
    uses: ./.github/workflows/build.yml

  apk:
    needs: version
    uses: ./.github/workflows/mobile.yml
    with:
      signed: true
      version-name: ${{ needs.version.outputs.name }}
      version-code: ${{ needs.version.outputs.code }}
    secrets: inherit

  publish:
    needs: [version, component, apk, python]
    # Rolling: Python skipped. Fixed: Python required. Never publish on cancel.
    if: >-
      ${{ !cancelled() &&
        needs.version.result == 'success' &&
        needs.component.result == 'success' &&
        needs.apk.result == 'success' &&
        (needs.version.outputs.rolling == 'true' || needs.python.result == 'success') }}
    runs-on: ubuntu-slim
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: foo_out_wam-x64
          path: component

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wambridge-apk
          path: apk

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wambridge-r8-mapping
          path: mapping

      - name: Publish the component and the APK together
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.name }}
          TITLE: ${{ needs.version.outputs.title }}
          ROLLING: ${{ needs.version.outputs.rolling }}
        run: |
          set -euo pipefail
          apk_file="apk/wambridge-${VERSION}.apk"
          test -s "$apk_file"
          apk_sha256="$(sha256sum "$apk_file" | cut -d' ' -f1)"
          # Mapping identity follows exact APK bytes. Keep historic maps only on fixed releases.
          mapping_name="wambridge-${VERSION}-${apk_sha256}-r8-mapping.txt"
          cp mapping/mapping.txt "mapping/$mapping_name"
          assets=(
            "component/foo_out_wam.fb2k-component"
            "component/wambridge-source.zip"
            "$apk_file"
            "mapping/$mapping_name"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
          done

          if [[ "$ROLLING" == "true" ]]; then
            {
              echo "Rolling release rebuilt from main at ${GITHUB_SHA:0:7}. Version ${VERSION}."
              echo
              echo "The foobar2000 component and Android APK are built from the same commit. The rolling APK download link stays unchanged."
            } > release-notes.md
          else
            echo "foobar2000 component and signed Android APK for ${VERSION}." > release-notes.md
          fi
          {
            echo
            echo "Android APK SHA-256: ${apk_sha256}"
            echo "R8 mapping for this exact APK: ${mapping_name}"
          } >> release-notes.md

          if [[ "$ROLLING" != "true" ]]; then
            existing_tag="$(gh api "repos/${GH_REPO}/git/refs/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)"
            if [[ -n "$existing_tag" && "$existing_tag" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to $existing_tag, refusing to publish this commit." >&2
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Upload the new mapping before replacing the rolling APK, without
            # overwriting or deleting older mappings if publication fails.
            if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -Fxq "$mapping_name"; then
              gh release upload "$TAG" "mapping/$mapping_name"
            fi
            gh release upload "$TAG" "${assets[0]}" "${assets[1]}" "${assets[2]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file release-notes.md --latest --target "$GITHUB_SHA"
          else
            gh release create "$TAG" "${assets[@]}" --target "$GITHUB_SHA" --title "$TITLE" --latest --notes-file release-notes.md
          fi

          if [[ "$ROLLING" == "true" ]]; then
            # Move tag only after the assets and release target are published.
            # The foobar update checker reads target_commitish from the release API.
            if ! gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f sha="$GITHUB_SHA" -F force=true >/dev/null 2>&1; then
              gh api --method POST "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA" >/dev/null
            fi

            # Rolling releases retain only the current APK and its R8 mapping.
            # Historical maps live in a one-time legacy ZIP or fixed versioned releases.
            # Cleanup happens only after the replacement assets and release metadata succeed.
            gh release view "$TAG" --json assets --jq '.assets[].name' > release-assets.txt
            while IFS= read -r asset; do
              case "$asset" in
                wambridge-*.apk)
                  if [[ "$asset" != "wambridge-${VERSION}.apk" ]]; then
                    gh release delete-asset "$TAG" "$asset" --yes
                  fi
                  ;;
                wambridge-*-r8-mapping.txt)
                  if [[ "$asset" != "$mapping_name" ]]; then
                    gh release delete-asset "$TAG" "$asset" --yes
                  fi
                  ;;
              esac
            done < release-assets.txt

            # One-time cleanup of the superseded rolling prerelease channel.
            gh release delete beta --yes >/dev/null 2>&1 || true
            gh api --method DELETE "repos/${GH_REPO}/git/refs/tags/beta" >/dev/null 2>&1 || true
          fi

  python:
    needs: version
    if: needs.version.outputs.rolling == 'false'
    runs-on: ubuntu-slim
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10
        with:
          enable-cache: false
      - run: uv python install 3.15
      - name: Validate Python package metadata
        env:
          RELEASE_VERSION: ${{ needs.version.outputs.name }}
        run: |
          uv run --no-project --python 3.15 -- python -c 'import os, pathlib, tomllib; p=tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]; assert p["name"] == "wambridge"; assert p["version"] == os.environ["RELEASE_VERSION"]'
      - name: Build wheel and sdist
        run: |
          uv build --no-sources --out-dir dist
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
      - name: Smoke test wheel and Python package
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          uv run --no-project --python 3.15 --with "./$wheel" -- python -c 'import wambridge, wambridge.radio_cli, wambridge.station_packs'
          uv run --no-project --python 3.15 --with "./$wheel" -- wambridge --help
          uv run --no-project --python 3.15 --with . -- python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: wambridge-python-distributions
          path: dist/*
          if-no-files-found: error

  pypi:
    needs: [version, python, publish]
    if: needs.version.outputs.rolling == 'false'
    runs-on: ubuntu-slim
    environment:
      name: pypi
      url: https://pypi.org/project/wambridge/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10
        with:
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: wambridge-python-distributions
          path: dist
      - run: uv publish --check-url https://pypi.org/simple/ dist/*
